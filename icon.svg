<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6A2B"/>
      <stop offset="100%" stop-color="#FC4C02"/>
    </linearGradient>
    <linearGradient id="limeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2FF4A"/>
      <stop offset="100%" stop-color="#CCFF00"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background Squircle -->
  <rect x="20" y="20" width="472" height="472" rx="110" fill="#0D0E11" stroke="#2B2E36" stroke-width="4"/>
  <rect x="36" y="36" width="440" height="440" rx="94" fill="none" stroke="#1E2127" stroke-width="2"/>
  
  <!-- Energy Bolt (Corporate Split: Orange Top / Volt Lime Bottom) -->
  <g filter="url(#glow)">
    <!-- Top Orange Wing (Nutrition / Energy) -->
    <polygon points="246,131 321,131 256,241 306,241 246,306 246,266 201,266" fill="url(#orangeGrad)"/>
    <!-- Bottom Volt Lime Wing (Output / Training) -->
    <polygon points="268,251 306,241 196,381 246,266" fill="url(#limeGrad)"/>
  </g>
  <!-- Sharp Cut Divider -->
  <line x1="181" y1="274" x2="331" y2="238" stroke="#0D0E11" stroke-width="7" stroke-linecap="round"/>
</svg>