<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0D0E11">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Bitácora">
  <meta name="description" content="Registro diario de comidas y entrenamiento - Recomposición corporal">
  <meta name="robots" content="noindex, nofollow">
  <title>Bitácora - Comidas & Entreno</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png?v=2">
  <link rel="icon" type="image/svg+xml" href="icon.svg?v=2">
  <link rel="icon" type="image/png" href="icon-192.png?v=2">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap">
  <style>
    :root {
      --bg: #0D0E11;
      --surface: #16181D;
      --surface-2: #1E2127;
      --border: #2B2E36;
      --text: #F3F4F6;
      --text-muted: #9CA3AF;
      --text-faint: #6B7280;
      --orange: #FF5A1F;
      --orange-bright: #FF6A2B;
      --orange-soft: rgba(255, 90, 31, 0.16);
      --lime: #CCFF00;
      --lime-bright: #CCFF00;
      --lime-soft: rgba(204, 255, 0, 0.14);
      --lime-dark: #CCFF00;
      --c-kcal: #FF5A1F;
      --c-kcal-soft: rgba(255, 90, 31, 0.16);
      --c-protein: #38BDF8;
      --c-protein-soft: rgba(56, 189, 248, 0.16);
      --c-carb: #FBBF24;
      --c-carb-soft: rgba(251, 191, 36, 0.16);
      --c-fat: #2DD4BF;
      --c-fat-soft: rgba(45, 212, 191, 0.16);
      --shadow: 0 2px 8px rgba(0,0,0,.45), 0 12px 28px -10px rgba(0,0,0,.65);
      --radius: 12px;
      color-scheme: dark;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 14px;
      line-height: 1.45;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 0 0 40px;
    }

    .app-shell {
      width: 100%;
      max-width: 580px;
      padding: 12px 14px 28px;
    }

    /* TOP BAR & MODULE SWITCH */
    .top-bar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--bg);
      padding: 6px 0 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      backdrop-filter: blur(10px);
    }
    .top-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .module-selector {
      display: flex;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 3px;
      gap: 3px;
      flex: 1;
    }
    .mod-tab {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px 12px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: .5px;
      text-transform: uppercase;
      border-radius: 999px;
      cursor: pointer;
      transition: all .18s ease;
    }
    .mod-tab.active.comidas {
      background: var(--orange);
      color: #FFFFFF;
      box-shadow: 0 2px 8px rgba(252,76,2,.35);
    }
    .mod-tab.active.entreno {
      background: var(--lime);
      color: #0D0E11;
      box-shadow: 0 2px 10px rgba(204,255,0,.35);
    }
    .tool-btn {
      width: 38px;
      height: 38px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }
    .tool-btn:hover { color: var(--text); background: var(--surface-2); }

    /* DATE PICKER BAR */
    .date-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 6px 10px;
      box-shadow: var(--shadow);
    }
    .date-nav-btn {
      width: 32px;
      height: 32px;
      border: none;
      background: var(--surface-2);
      color: var(--text);
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
    }
    .date-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      position: relative;
    }
    .date-day-name {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 18px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .5px;
      color: var(--text);
    }
    .date-sub {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 500;
    }
    .date-input-hidden {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    /* DAY PLAN PILL (Target description) */
    .day-plan-pill {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-radius: 8px;
      padding: 7px 12px;
      font-size: 12px;
      font-weight: 600;
      margin-top: 2px;
      border: 1px solid var(--border);
    }
    .day-plan-pill.gym {
      background: var(--orange-soft);
      color: var(--orange);
      border-color: rgba(252,76,2,.2);
    }
    .day-plan-pill.rest {
      background: var(--surface-2);
      color: var(--text-muted);
    }
    .day-plan-pill.flexi {
      background: rgba(251, 191, 36, 0.15);
      color: #FBBF24;
      border-color: rgba(251, 191, 36, 0.35);
    }

    /* TILES GRID */
    .tiles {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin: 12px 0;
    }
    .tile {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 9px 8px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }
    .tile-values {
      display: flex;
      align-items: baseline;
      gap: 3px;
      white-space: nowrap;
      overflow: hidden;
    }
    .tile-now {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 20px;
      font-weight: 800;
      color: var(--text);
      line-height: 1;
    }
    .tile-target {
      font-size: 10px;
      color: var(--text-muted);
      font-weight: 500;
    }
    .tile-name {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .5px;
      color: var(--text-muted);
    }
    .bar-track {
      height: 4px;
      background: var(--surface-2);
      border-radius: 2px;
      overflow: hidden;
      margin-top: 4px;
    }
    .bar-fill {
      height: 100%;
      border-radius: 2px;
      transition: width .25s ease;
    }
    .tile.kcal .bar-fill { background: var(--c-kcal); }
    .tile.protein .bar-fill { background: var(--c-protein); }
    .tile.carb .bar-fill { background: var(--c-carb); }
    .tile.fat .bar-fill { background: var(--c-fat); }

    /* SECTION CONTAINERS */
    .view-section { display: none; }
    .view-section.active { display: block; }

    /* MEALS CARDS */
    .meals { display: flex; flex-direction: column; gap: 10px; }
    .meal-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: border-color .15s ease;
    }
    .meal-card.eaten {
      border-color: rgba(252,76,2,.4);
      background: var(--surface);
    }
    .meal-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .meal-name-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .meal-slot {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .5px;
      padding: 2px 6px;
      border-radius: 4px;
      background: var(--surface-2);
      color: var(--text-muted);
    }
    .meal-name-col { display: flex; flex-direction: column; }
    .meal-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 17px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .4px;
      color: var(--text);
      line-height: 1.15;
    }
    .meal-sub {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 500;
    }
    .eat-toggle {
      width: 32px;
      height: 32px;
      border-radius: 999px;
      border: 2px solid var(--border);
      background: transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: transparent;
      transition: all .15s ease;
    }
    .eat-toggle.on {
      background: var(--orange);
      border-color: var(--orange);
      color: #FFFFFF;
    }
    .block-select {
      width: 100%;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px 10px;
      font-size: 13px;
      color: var(--text);
      font-weight: 600;
      outline: none;
      cursor: pointer;
    }
    .item-list {
      list-style: none;
      border-top: 1px dashed var(--border);
      padding-top: 6px;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .item-list li {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--text-muted);
    }
    .item-list .qty {
      font-weight: 600;
      color: var(--text);
    }
    .meal-macros {
      display: flex;
      gap: 12px;
      font-size: 11px;
      color: var(--text-muted);
      border-top: 1px solid var(--border);
      padding-top: 6px;
    }
    .meal-macros span b {
      color: var(--text);
      font-weight: 700;
      margin-right: 2px;
    }
    .extra-note {
      font-size: 11px;
      color: var(--orange);
      font-weight: 600;
      background: var(--orange-soft);
      padding: 4px 8px;
      border-radius: 6px;
    }

    /* HISTORY BAR (Comidas) */
    .history {
      margin-top: 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px;
      box-shadow: var(--shadow);
    }
    .history-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 10px;
    }
    .history-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 15px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .5px;
    }
    .history-hint {
      font-size: 10px;
      color: var(--text-muted);
    }
    .history-row {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
      height: 90px;
      align-items: end;
    }
    .hbar-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      height: 100%;
    }
    .hbar-track {
      flex: 1;
      width: 100%;
      background: var(--surface-2);
      border-radius: 4px;
      position: relative;
      display: flex;
      align-items: flex-end;
      overflow: hidden;
    }
    .hbar-band {
      position: absolute;
      left: 0; right: 0;
      background: rgba(252,76,2,.15);
      pointer-events: none;
    }
    .hbar-fill {
      width: 100%;
      background: var(--orange);
      border-radius: 4px 4px 0 0;
      transition: height .3s ease;
    }
    .hbar-fill.today {
      box-shadow: 0 0 6px rgba(252,76,2,.6);
    }
    .hbar-day {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--text-muted);
    }
    .hbar-day.today { color: var(--orange); font-weight: 800; }
    .hbar-kcal {
      font-size: 9px;
      color: var(--text-faint);
      font-weight: 600;
    }

    /* ============================================================
       ENTRENAMIENTO MODULE STYLES (Color Lima Strava)
       ============================================================ */
    .entreno-tabs-row {
      display: flex;
      gap: 4px;
      overflow-x: auto;
      padding-bottom: 6px;
      margin-bottom: 12px;
      scrollbar-width: none;
    }
    .entreno-tabs-row::-webkit-scrollbar { display: none; }
    .day-tab-chip {
      padding: 6px 12px;
      border-radius: 999px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .4px;
      text-transform: uppercase;
      white-space: nowrap;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .day-tab-chip.active {
      background: var(--lime);
      color: #121212;
      border-color: var(--lime);
      box-shadow: 0 2px 8px rgba(163,230,53,.3);
    }
    .day-tab-chip .chip-dot {
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: var(--text-faint);
    }
    .day-tab-chip.active .chip-dot { background: #0D0E11; }

    /* WORKOUT HEADER CARD */
    .workout-summary-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      box-shadow: var(--shadow);
      margin-bottom: 14px;
      border-left: 4px solid var(--lime);
    }
    .ws-top {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
    }
    .ws-badge {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .6px;
      padding: 2px 7px;
      border-radius: 4px;
      background: var(--lime-soft);
      color: var(--lime-dark);
      text-transform: uppercase;
    }
    .ws-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 22px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .5px;
      color: var(--text);
      line-height: 1.1;
      margin-top: 4px;
    }
    .ws-sub {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 3px;
      font-weight: 500;
    }
    .ws-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: 8px;
    }
    .ws-tag {
      font-size: 10px;
      font-weight: 700;
      background: var(--surface-2);
      color: var(--text-muted);
      padding: 2px 6px;
      border-radius: 4px;
      text-transform: uppercase;
    }

    /* EXERCISE CARDS */
    .exercise-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      box-shadow: var(--shadow);
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .ex-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
    }
    .ex-num {
      width: 24px;
      height: 24px;
      border-radius: 6px;
      background: var(--surface-2);
      color: var(--text);
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 14px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .ex-title-wrap { flex: 1; }
    .ex-name {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: .3px;
      color: var(--text);
      line-height: 1.15;
    }
    .ex-target {
      font-size: 11px;
      font-weight: 600;
      color: var(--lime);
      margin-top: 2px;
    }
    .ex-equip-badge {
      font-size: 10px;
      font-weight: 600;
      background: var(--surface-2);
      color: var(--text-muted);
      padding: 2px 6px;
      border-radius: 4px;
      white-space: nowrap;
    }

    /* EXERCISE MEDIA / PHOTO BOX */
    .ex-media-box {
      border-radius: 8px;
      background: var(--surface-2);
      overflow: hidden;
      border: 1px solid var(--border);
      position: relative;
    }
    .ex-img-container {
      width: 100%;
      height: 210px;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      cursor: pointer;
    }
    .ex-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      user-select: none;
    }
    .ex-img-overlay {
      position: absolute;
      bottom: 8px;
      right: 8px;
      background: rgba(18,18,18,.8);
      backdrop-filter: blur(4px);
      color: #FFFFFF;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .5px;
      padding: 3px 8px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .ex-img-nav {
      display: flex;
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 6px 10px;
      align-items: center;
      justify-content: space-between;
    }
    .ex-phase-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
    }
    .btn-toggle-phase {
      padding: 4px 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }

    /* CUE CARD */
    .ex-cue {
      background: var(--surface-2);
      border-left: 3px solid var(--lime);
      padding: 7px 10px;
      border-radius: 0 6px 6px 0;
      font-size: 11.5px;
      color: var(--text-muted);
      line-height: 1.35;
    }
    .ex-cue b { color: var(--text); }

    /* SETS TRACKER TABLE */
    .sets-table-wrap {
      margin-top: 4px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .sets-header {
      display: grid;
      grid-template-columns: 36px 1fr 68px 58px 38px;
      gap: 6px;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .4px;
      color: var(--text-faint);
      padding: 0 4px;
    }
    .set-row {
      display: grid;
      grid-template-columns: 36px 1fr 68px 58px 38px;
      gap: 6px;
      align-items: center;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 5px 6px;
      transition: all .15s ease;
    }
    .set-row.completed {
      background: rgba(163,230,53,.1);
      border-color: rgba(163,230,53,.4);
    }
    .set-idx {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 13px;
      font-weight: 800;
      color: var(--text-muted);
      text-align: center;
    }
    .set-prev {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .set-input {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 4px;
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
      text-align: center;
      outline: none;
    }
    .set-input:focus { border-color: var(--lime); }
    .set-check-btn {
      width: 32px;
      height: 32px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-weight: 800;
      font-size: 14px;
      transition: all .15s ease;
    }
    .set-check-btn.checked {
      background: var(--lime);
      border-color: var(--lime);
      color: #0D0E11;
    }
    .btn-add-set {
      padding: 6px;
      border: 1px dashed var(--border);
      background: transparent;
      color: var(--text-muted);
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
      margin-top: 2px;
    }
    .btn-add-set:hover { color: var(--text); background: var(--surface-2); }

    /* REST DAY CARD */
    .rest-day-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px 16px;
      text-align: center;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    .rd-icon { font-size: 38px; }

  /* ====================================================================
     3. PERSISTENCIA EN LOCALSTORAGE
     ==================================================================== */
  const STORAGE_KEY_MEALS = "bitacora-nutricional-v1";
  const STORAGE_KEY_WORKOUT = "bitacora-entreno-v1";

  function loadLog(){
    try{ return JSON.parse(localStorage.getItem(STORAGE_KEY_MEALS)) || {}; }catch(e){ return {}; }
  }
  function saveLog(log){
    try{ localStorage.setItem(STORAGE_KEY_MEALS, JSON.stringify(log)); }catch(e){}
  }
  function loadWorkoutLog(){
    try{ return JSON.parse(localStorage.getItem(STORAGE_KEY_WORKOUT)) || {}; }catch(e){ return {}; }
  }
  function saveWorkoutLog(wLog){
    try{ localStorage.setItem(STORAGE_KEY_WORKOUT, JSON.stringify(wLog)); }catch(e){}
  }

  let log = loadLog();
  let workoutLog = loadWorkoutLog();

  /* ====================================================================
     4. FECHAS Y ESTADO GLOBAL
     ==================================================================== */
  function isoDate(d){
    const off = d.getTimezoneOffset();
    const local = new Date(d.getTime() - off*60000);
    return local.toISOString().slice(0,10);
  }
  function parseISO(s){
    const [y,m,d] = s.split("-").map(Number);
    return new Date(y, m-1, d);
  }

  let currentDate = new Date();
  let currentModule = localStorage.getItem("bitacora_active_module") || "comidas";

  function getDayEntry(dateStr){
    const dow = parseISO(dateStr).getDay();
    const defaults = CALENDAR[dow];
    if(!log[dateStr]) log[dateStr] = {};
    ['desayuno','comida','merienda','cena'].forEach(mk => {
      if(!log[dateStr][mk] || !log[dateStr][mk].block){
        log[dateStr][mk] = { block: defaults[mk] || Object.keys(BLOCKS[mk])[0], eaten: false };
      }
    });
    return log[dateStr];
  }

  /* ====================================================================
     5. RENDERIZADO: COMIDAS
     ==================================================================== */
  const mealsContainer = document.getElementById("mealsContainer");
  const dateInput = document.getElementById("dateInput");
  const dayLabel = document.getElementById("dayLabel");
  const dateSubLabel = document.getElementById("dateSubLabel");
  const dayPlanPill = document.getElementById("dayPlanPill");
  const dayPlanText = document.getElementById("dayPlanText");
  const dayPlanBadge = document.getElementById("dayPlanBadge");

  function fmt(n){ return Math.round(n*10)/10; }

  function renderComidas(){
    const dateStr = isoDate(currentDate);
    const dow = currentDate.getDay();
    const cal = CALENDAR[dow];
    const plan = TARGETS_BY_TYPE[cal.type];

    // Actualizar Plan Pill
    dayPlanPill.className = "day-plan-pill " + plan.class;
    dayPlanText.textContent = plan.label + " (" + plan.kcal[0] + "–" + plan.kcal[1] + " kcal)";
    dayPlanBadge.textContent = plan.badge;

    // Actualizar objetivos en tiles
    document.getElementById("t-kcal").textContent = "/ " + plan.kcal[1];
    document.getElementById("t-protein").textContent = "/ " + plan.p[1] + " g";
    document.getElementById("t-carb").textContent = "/ " + plan.c[1] + " g";
    document.getElementById("t-fat").textContent = "/ " + plan.g[1] + " g";

    const entry = getDayEntry(dateStr);
    mealsContainer.innerHTML = "";
    let totals = { kcal:0, p:0, c:0, g:0 };

    Object.keys(MEAL_META).forEach(mealKey => {
      const meta = MEAL_META[mealKey];
      const options = BLOCKS[mealKey];
      const sel = entry[mealKey];
      if(!options[sel.block]){
        sel.block = Object.keys(options)[0];
      }
      const block = options[sel.block];

      if(sel.eaten){
        totals.kcal += block.kcal;
        totals.p += block.p;
        totals.c += block.c;
        totals.g += block.g;
      }

      const card = document.createElement("div");
      card.className = "meal-card" + (sel.eaten ? " eaten" : "");

      const top = document.createElement("div");
      top.className = "meal-top";

      const nameRow = document.createElement("div");
      nameRow.className = "meal-name-row";
      nameRow.innerHTML = `<span class="meal-slot">${meta.slot}</span>
        <div class="meal-name-col">
          <span class="meal-title">${meta.title}</span>
          <span class="meal-sub">${block.label}</span>
        </div>`;

      const toggle = document.createElement("button");
      toggle.className = "eat-toggle" + (sel.eaten ? " on" : "");
      toggle.innerHTML = sel.eaten ? "✓" : "";
      toggle.setAttribute("aria-label", sel.eaten ? "Marcar no comido" : "Marcar comido");
      toggle.onclick = () => {
        sel.eaten = !sel.eaten;
        saveLog(log);
        render();
      };

      top.appendChild(nameRow);
      top.appendChild(toggle);
      card.appendChild(top);

      const selectWrap = document.createElement("select");
      selectWrap.className = "block-select";
      Object.keys(options).forEach(id => {
        const opt = document.createElement("option");
        opt.value = id;
        opt.textContent = `${id} · ${options[id].label} (${options[id].kcal} kcal)`;
        if(id === sel.block) opt.selected = true;
        selectWrap.appendChild(opt);
      });
      selectWrap.onchange = (e) => {
        sel.block = e.target.value;
        saveLog(log);
        render();
      };
      card.appendChild(selectWrap);

      const list = document.createElement("ul");
      list.className = "item-list";
      block.items.forEach(([name, qty]) => {
        const li = document.createElement("li");
        li.innerHTML = `<span>${name}</span><span class="qty">${qty}</span>`;
        list.appendChild(li);
      });
      card.appendChild(list);

      const macros = document.createElement("div");
      macros.className = "meal-macros";
      macros.innerHTML = `<span><b>${block.kcal}</b> kcal</span>
        <span><b>${block.p}g</b> P</span>
        <span><b>${block.c}g</b> C</span>
        <span><b>${block.g}g</b> G</span>`;
      card.appendChild(macros);

      mealsContainer.appendChild(card);
    });

    setTile("kcal", totals.kcal, plan.kcal, "");
    setTile("protein", totals.p, plan.p, "g");
    setTile("carb", totals.c, plan.c, "g");
    setTile("fat", totals.g, plan.g, "g");

    renderHistory(dateStr, plan.kcal);
  }

  function setTile(key, value, target, unit){
    document.getElementById("v-"+key).textContent = fmt(value) + (unit ? " "+unit : "");
    const pct = Math.max(0, Math.min(100, (value / target[1]) * 100));
    document.getElementById("b-"+key).style.width = pct + "%";
  }

  function renderHistory(currentDateStr, targetKcalRange){
    const row = document.getElementById("historyRow");
    row.innerHTML = "";
    const base = parseISO(currentDateStr);
    const days = [];
    for(let i=6; i>=0; i--){
      const d = new Date(base);
      d.setDate(base.getDate() - i);
      days.push(d);
    }
    const maxKcal = Math.max(targetKcalRange[1], 2000);

    days.forEach(d => {
      const ds = isoDate(d);
      const e = log[ds];
      let kcal = 0;
      if(e){
        kcal = Object.keys(MEAL_META).reduce((sum, mk) => {
          if(!e[mk] || !e[mk].eaten) return sum;
          const b = BLOCKS[mk][e[mk].block];
          return sum + (b ? b.kcal : 0);
        }, 0);
      }
      const isToday = ds === currentDateStr;
      const wrap = document.createElement("div");
      wrap.className = "hbar-wrap";

      const track = document.createElement("div");
      track.className = "hbar-track";

      const bandBottom = (targetKcalRange[0]/maxKcal)*100;
      const bandTop = (targetKcalRange[1]/maxKcal)*100;
      const band = document.createElement("div");
      band.className = "hbar-band";
      band.style.bottom = bandBottom + "%";
      band.style.height = (bandTop - bandBottom) + "%";
      track.appendChild(band);

      const fill = document.createElement("div");
      fill.className = "hbar-fill" + (isToday ? " today" : "");
      fill.style.height = Math.max(2, (kcal/maxKcal)*100) + "%";
      track.appendChild(fill);

      const dayName = document.createElement("span");
      dayName.className = "hbar-day" + (isToday ? " today" : "");
      dayName.textContent = DAY_SHORT[d.getDay()];

      const kcalLabel = document.createElement("span");
      kcalLabel.className = "hbar-kcal";
      kcalLabel.textContent = kcal > 0 ? Math.round(kcal) : "·";

      wrap.appendChild(track);
      wrap.appendChild(dayName);
      wrap.appendChild(kcalLabel);
      row.appendChild(wrap);
    });
  }

  /* ====================================================================
     6. RENDERIZADO: ENTRENAMIENTO (RUTINA & PESOS)
     ==================================================================== */
  const entrenoContainer = document.getElementById("entrenoContainer");

  function getWorkoutEntry(dateStr, exId){
    if(!workoutLog[dateStr]) workoutLog[dateStr] = {};
    if(!workoutLog[dateStr][exId]) workoutLog[dateStr][exId] = [];
    return workoutLog[dateStr][exId];
  }

  function getPreviousWorkoutEntry(beforeDateStr, exId){
    const dates = Object.keys(workoutLog).filter(d => d < beforeDateStr).sort().reverse();
    for(let d of dates){
      const entries = workoutLog[d][exId];
      if(entries && entries.length > 0 && entries.some(s => s && s.weight)){
        return { date: d, sets: entries };
      }
    }
    return null;
  }

  function renderEntreno(){
    const dateStr = isoDate(currentDate);
    const dow = currentDate.getDay();
    const dayData = WORKOUT_DAYS[dow];

    // Actualizar chips de días
    document.querySelectorAll(".day-tab-chip").forEach((chip, idx) => {
      // Map chip order: 0:LUN, 1:MAR, 2:MIÉ, 3:JUE, 4:VIE, 5:SÁB, 6:DOM
      const mapDow = [1,2,3,4,5,6,0][idx];
      chip.classList.toggle("active", mapDow === dow);
    });

    entrenoContainer.innerHTML = "";

    // SI ES DÍA DE DESCANSO
    if(dayData.rest){
      const restCard = document.createElement("div");
      restCard.className = "rest-day-card";
      restCard.innerHTML = `
        <div class="rd-icon">🔋</div>
        <h2 class="rd-title">${dayData.title}</h2>
        <p class="rd-desc">${dayData.cue}</p>
        <div style="margin-top:10px; font-size:11px; color:var(--text-faint);">
          Toca cualquiera de los botones de arriba (LUN, MAR, JUE, VIE) para ver la rutina de ese día o registrar pesos.
        </div>
      `;
      entrenoContainer.appendChild(restCard);
      return;
    }

    // CABECERA DEL DÍA DE ENTRENAMIENTO
    const summaryCard = document.createElement("div");
    summaryCard.className = "workout-summary-card";
    summaryCard.innerHTML = `
      <div class="ws-top">
        <span class="ws-badge">${dayData.badge}</span>
      </div>
      <h2 class="ws-title">${dayData.title}</h2>
      <div class="ws-sub">${dayData.subtitle}</div>
      <div class="ws-tags">
        ${dayData.focus.map(f => `<span class="ws-tag">${f}</span>`).join("")}
      </div>
    `;
    entrenoContainer.appendChild(summaryCard);

    // TARJETAS DE EJERCICIOS
    dayData.exercises.forEach((ex, exIdx) => {
      const exCard = document.createElement("div");
      exCard.className = "exercise-card";

      // Head
      const head = document.createElement("div");
      head.className = "ex-head";
      head.innerHTML = `
        <div class="ex-num">${exIdx + 1}</div>
        <div class="ex-title-wrap">
          <div class="ex-name">${ex.name}</div>
          <div class="ex-target">🎯 ${ex.target}</div>
        </div>
        <div class="ex-equip-badge">${ex.sets} series · ${ex.repRange}</div>
      `;
      exCard.appendChild(head);

      // Media Box (Local Photos with Toggle)
      const mediaBox = document.createElement("div");
      mediaBox.className = "ex-media-box";
      
      const imgCont = document.createElement("div");
      imgCont.className = "ex-img-container";
      const imgEl = document.createElement("img");
      imgEl.className = "ex-img";
      imgEl.id = `img-${ex.id}`;
      imgEl.src = `media/exercises/${ex.media}/0.jpg`;
      imgEl.alt = ex.name;

      const overlay = document.createElement("div");
      overlay.className = "ex-img-overlay";
      overlay.id = `badge-${ex.id}`;
      overlay.innerHTML = `<span>📷 1/2 Inicio</span>`;

      let currentPhase = 0;
      function flipPhase(){
        currentPhase = currentPhase === 0 ? 1 : 0;
        imgEl.src = `media/exercises/${ex.media}/${currentPhase}.jpg`;
        overlay.innerHTML = currentPhase === 0 ? "<span>📷 1/2 Inicio</span>" : "<span>⚡ 2/2 Contracción</span>";
      }

      imgCont.onclick = flipPhase;
      imgCont.appendChild(imgEl);
      imgCont.appendChild(overlay);
      mediaBox.appendChild(imgCont);

      const imgNav = document.createElement("div");
      imgNav.className = "ex-img-nav";
      imgNav.innerHTML = `
        <span class="ex-phase-label">Toca la foto para alternar movimiento</span>
        <button type="button" class="btn-toggle-phase">Ver ${currentPhase === 0 ? "Contracción" : "Inicio"}</button>
      `;
      imgNav.querySelector(".btn-toggle-phase").onclick = (e) => {
        e.stopPropagation();
        flipPhase();
        e.target.textContent = currentPhase === 0 ? "Ver Contracción" : "Ver Inicio";
      };
      mediaBox.appendChild(imgNav);
      exCard.appendChild(mediaBox);

      // Cue Box
      const cue = document.createElement("div");
      cue.className = "ex-cue";
      cue.innerHTML = `<b>Técnica:</b> ${ex.cue}`;
      exCard.appendChild(cue);

      // Sets Tracker Table
      const setsWrap = document.createElement("div");
      setsWrap.className = "sets-table-wrap";

      const setsHeader = document.createElement("div");
      setsHeader.className = "sets-header";
      setsHeader.innerHTML = `
        <div>Serie</div>
        <div>Anterior</div>
        <div>Peso (kg)</div>
        <div>Reps</div>
        <div>OK</div>
      `;
      setsWrap.appendChild(setsHeader);

      const savedSets = getWorkoutEntry(dateStr, ex.id);
      const prevData = getPreviousWorkoutEntry(dateStr, ex.id);

      // Ensure minimum default rows match ex.sets
      const totalRows = Math.max(ex.sets, savedSets.length);

      for(let sIdx = 0; sIdx < totalRows; sIdx++){
        const row = document.createElement("div");
        const setData = savedSets[sIdx] || { weight: "", reps: "", done: false };
        row.className = "set-row" + (setData.done ? " completed" : "");

        const prevSet = prevData && prevData.sets && prevData.sets[sIdx];
        const prevText = prevSet && (prevSet.weight || prevSet.reps)
          ? `${prevSet.weight || "0"}kg × ${prevSet.reps || "0"}`
          : "—";

        row.innerHTML = `
          <div class="set-idx">${sIdx + 1}</div>
          <div class="set-prev" title="Sesión previa del ${prevData ? prevData.date : ''}">${prevText}</div>
          <div><input type="number" step="0.5" class="set-input weight-in" placeholder="kg" value="${setData.weight || ''}"></div>
          <div><input type="number" step="1" class="set-input reps-in" placeholder="reps" value="${setData.reps || ''}"></div>
          <div style="display:flex; justify-content:center;">
            <button type="button" class="set-check-btn ${setData.done ? 'checked' : ''}" title="Marcar serie completada">✓</button>
          </div>
        `;

        const wIn = row.querySelector(".weight-in");
        const rIn = row.querySelector(".reps-in");
        const chkBtn = row.querySelector(".set-check-btn");

        function updateSet(){
          savedSets[sIdx] = {
            weight: wIn.value,
            reps: rIn.value,
            done: chkBtn.classList.contains("checked")
          };
          saveWorkoutLog(workoutLog);
        }

        wIn.oninput = updateSet;
        rIn.oninput = updateSet;
        chkBtn.onclick = () => {
          chkBtn.classList.toggle("checked");
          row.classList.toggle("completed", chkBtn.classList.contains("checked"));
          updateSet();
        };

        setsWrap.appendChild(row);
      }

      // Add Set Button
      const btnAddSet = document.createElement("button");
      btnAddSet.type = "button";
      btnAddSet.className = "btn-add-set";
      btnAddSet.textContent = "+ Añadir otra serie";
      btnAddSet.onclick = () => {
        savedSets.push({ weight: "", reps: "", done: false });
        saveWorkoutLog(workoutLog);
        renderEntreno();
      };
      setsWrap.appendChild(btnAddSet);

      exCard.appendChild(setsWrap);
      entrenoContainer.appendChild(exCard);
    });
  }

  /* ====================================================================
     7. CONTROL DE FECHAS & NAVEGACIÓN
     ==================================================================== */
  function render(){
    const dateStr = isoDate(currentDate);
    dateInput.value = dateStr;
    const dow = currentDate.getDay();
    dayLabel.textContent = DAY_NAMES[dow].toUpperCase();

    // Sublabel con formato "31 oct 2026"
    const options = { day: 'numeric', month: 'short', year: 'numeric' };
    dateSubLabel.textContent = currentDate.toLocaleDateString('es-ES', options);

    if(currentModule === "comidas"){
      renderComidas();
    } else {
      renderEntreno();
    }
  }

    function stepDate(delta){
    currentDate.setDate(currentDate.getDate() + delta);
    render();
  }
  window.stepDate = stepDate;

  function onDateChanged(val){
    if(!val) return;
    currentDate = parseISO(val);
    render();
  }
  window.onDateChanged = onDateChanged;

  function switchModule(mod){
    currentModule = mod;
    try { localStorage.setItem("bitacora_active_module", mod); } catch(e){}

    const tabC = document.getElementById("tabComidas");
    const tabE = document.getElementById("tabEntreno");
    const viewC = document.getElementById("viewComidas");
    const viewE = document.getElementById("viewEntreno");

    if (tabC) tabC.classList.toggle("active", mod === "comidas");
    if (tabE) tabE.classList.toggle("active", mod === "entreno");
    if (viewC) viewC.classList.toggle("active", mod === "comidas");
    if (viewE) viewE.classList.toggle("active", mod === "entreno");

    render();
  }
  window.switchModule = switchModule;

  function jumpToEntrenoDay(targetDow){
    const curDow = currentDate.getDay();
    let diff = targetDow - curDow;
    currentDate.setDate(currentDate.getDate() + diff);
    render();
  }
  window.jumpToEntrenoDay = jumpToEntrenoDay;

  /* ====================================================================
     8. COPIA DE SEGURIDAD / BACKUP
     ==================================================================== */
  function openBackupModal(){
    const m = document.getElementById("backupModal");
    if (m) m.classList.add("open");
  }
  window.openBackupModal = openBackupModal;

  function closeBackupModal(){
    const m = document.getElementById("backupModal");
    if (m) m.classList.remove("open");
  }
  window.closeBackupModal = closeBackupModal;

  function exportDataBackup(){
    const fullBackup = {
      version: 1,
      exportedAt: new Date().toISOString(),
      meals: log,
      workouts: workoutLog
    };
    const blob = new Blob([JSON.stringify(fullBackup, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `bitacora-backup-${isoDate(new Date())}.json`;
    a.click();
    URL.revokeObjectURL(url);
  }
  window.exportDataBackup = exportDataBackup;

  function importDataBackup(event){
    const file = event.target.files && event.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = function(e){
      try {
        const data = JSON.parse(e.target.result);
        if(data.meals) log = data.meals;
        if(data.workouts) workoutLog = data.workouts;
        saveLog(log);
        saveWorkoutLog(workoutLog);
        alert("¡Copia de seguridad restaurada correctamente!");
        closeBackupModal();
        render();
      } catch(err){
        alert("Error al leer el archivo de copia de seguridad: " + err.message);
      }
    };
    reader.readAsText(file);
  }
  window.importDataBackup = importDataBackup;

  // Inicialización
  switchModule(currentModule);

})();
</script>
</body>
</html>
